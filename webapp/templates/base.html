<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Ransomware Detector{% endblock %}</title>

    <!-- tailwind via cdn so no need for build step-->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- top nav bar -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-red-500 text-2xl">🛡️</span>
                <span class="text-xl font-bold">Ransomware Detector</span>
            </div>
            <div class="flex items-center gap-6 text-sm">

                <!-- monitor status indicator -->
                <!-- green pulsing dot when monitor is active, grey static dot when offline -->
                <div class="flex items-center gap-2 px-3 py-1 bg-slate-900 rounded-full border border-slate-700">
                    {% if monitor_status == "active" %}
                        <span class="relative flex h-2.5 w-2.5">
                            <!-- the absolute span is the outer ring that "beats" out -->
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                            <!-- the second span is the solid dot in the middle -->
                            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                        </span>
                        <span class="text-green-400 text-xs font-medium">Monitor: Active</span>
                    {% else %}
                        <span class="h-2.5 w-2.5 rounded-full bg-slate-500"></span>
                        <span class="text-slate-400 text-xs font-medium">Monitor: Offline</span>
                    {% endif %}
                </div>

                <a href="/" class="hover:text-red-400">Dashboard</a>
                <a href="/alerts" class="hover:text-red-400">Alerts</a>
                <a href="/about" class="hover:text-red-400">About</a>
            </div>
        </div>
    </nav>

    <!-- main page content -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
