<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Ransomware Detector{% endblock %}</title>

    <!-- tailwind via cdn so no need for build step-->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased">
    <style>
        body {
            background:
                radial-gradient(circle at 0% 0%, rgba(30, 58, 138, 0.15), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(127, 29, 29, 0.10), transparent 40%),
                rgb(15, 23, 42);
            background-attachment: fixed;
        }
        /* smoother transitions everywhere */
        button, a {
            transition: all 0.2s ease;
        }
    </style>

    <!-- top nav bar -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- shield icon from lucide.dev found online -->
                <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="text-red-500">
                    <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path>
                    <path d="m9 12 2 2 4-4"></path>
                </svg>
                <span class="text-xl font-bold">Ransomware Detector</span>
            </div>

            <div class="flex items-center gap-6 text-sm">

                <!-- monitor status indicator + control button -->
                <div class="flex items-center gap-2">

                    <!-- status pill -->
                    <!-- green pulsing dot when monitor is active, grey static dot when offline -->
                    <div class="flex items-center gap-2 px-3 py-1 bg-slate-900 rounded-full border border-slate-700">
                        {% if monitor_status == "active" %}
                            <span class="relative flex h-2.5 w-2.5">
                                <!-- the absolute span is the outer ring that "beats" out -->
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                <!-- the second span is the solid dot in the middle -->
                                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                            </span>
                            <span class="text-green-400 text-xs font-medium">Monitor: Active</span>
                        {% else %}
                            <span class="h-2.5 w-2.5 rounded-full bg-slate-500"></span>
                            <span class="text-slate-400 text-xs font-medium">Monitor: Offline</span>
                        {% endif %}
                    </div>

                    <!-- control button - starts or stops the monitor subprocess -->
                    {% if monitor_status == "active" %}
                        <button onclick="controlMonitor('stop')"
                                class="px-3 py-1 bg-red-900/60 hover:bg-red-800 text-red-200 rounded-full text-xs font-medium transition border border-red-800">
                            Stop
                        </button>
                    {% else %}
                        <button onclick="controlMonitor('start')"
                                class="px-3 py-1 bg-green-900/60 hover:bg-green-800 text-green-200 rounded-full text-xs font-medium transition border border-green-800">
                            Start
                        </button>
                    {% endif %}

                </div>

                <a href="/" class="hover:text-red-400">Dashboard</a>
                <a href="/alerts" class="hover:text-red-400">Alerts</a>
                <a href="/about" class="hover:text-red-400">About</a>
            </div>
        </div>
    </nav>

    <!-- main page content -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- monitor control script -->
    <!-- start/stop sends a POST to flask and then reloads so the navbar updates -->
    <script>
        function controlMonitor(action) {
            fetch("/monitor/" + action, { method: "POST" })
                .then(() => {
                    // small delay so the subprocess actually starts before we reload
                    setTimeout(() => window.location.reload(), 500);
                })
                .catch(err => alert("Error: " + err.message));
        }
    </script>

</body>
</html>
